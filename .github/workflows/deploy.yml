name: Deploy

on:
    push:
        branches: [ "main" ]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-java@v4
                with:
                    java-version: '25'
                    distribution: 'temurin'
                    cache: maven
            -   run: ./mvnw -B verify

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/pf:latest

    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      docker pull ${{ secrets.DOCKERHUB_USERNAME }}/pf:latest
                      docker rm -f pf-app || true
                      docker run -d --name pf-app --restart unless-stopped \
                        --network pf-net \
                        --env-file ~/pf.env \
                        -p 8080:8080 \
                        ${{ secrets.DOCKERHUB_USERNAME }}/pf:latest
                      docker image prune -f